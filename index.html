<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="titolo">I miei task</h1>

    <div class="aggiunta">
      <input id="nuovo-task" placeholder="Cosa devi fare?" />
      <button id="bottone-aggiungi">Aggiungi</button>
    </div>

    <!-- I TRE BOTTONI DI FILTRO -->
    <div id="filtri-group">
      <button id="btn-tutti">Tutti</button>
      <button id="btn-attivi">Attivi</button>
      <button id="btn-completati">Completati</button>
    </div>

    <ul id="lista-task"></ul>

    <p>Totale attivi: <span id="contatore">0</span></p>

    <script src="script.js"></script>
  </body>
</html>
